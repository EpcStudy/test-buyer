<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабинет · тест для медиабаеров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1520; --ink-2:#5C6773; --ink-3:#8B95A1;
  --paper:#F2F3F1; --card:#FFF; --line:#DCE0E4; --line-2:#EDF0F2;
  --accent:#2B3A8C; --accent-w:#E4E7F4;
  --pass:#1F6B4E; --pass-w:#DFEDE6;
  --fail:#A32B22; --fail-w:#F6E2DF;
  --warn:#8A6100; --warn-w:#F8EEDA;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14.5px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:3px;padding:9px 11px;background:var(--card);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.mono{font-family:'JetBrains Mono',monospace}
.hide{display:none!important}

/* top bar */
header.bar{background:var(--ink);color:#fff;padding:0 22px;display:flex;align-items:center;gap:20px;height:54px;position:sticky;top:0;z-index:20}
header.bar .logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px;letter-spacing:-.01em}
header.bar nav{display:flex;gap:2px;margin-left:8px}
header.bar nav button{background:none;border:none;color:rgba(255,255,255,.62);font-size:13.5px;padding:7px 12px;border-radius:3px}
header.bar nav button:hover{color:#fff;background:rgba(255,255,255,.08)}
header.bar nav button.on{color:var(--ink);background:#fff;font-weight:500}
header.bar .who{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:12px}
header.bar .who button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;padding:4px 10px;border-radius:3px}

.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 90px}
h1.page{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:13.5px;margin-bottom:20px}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:360px}
#login h1{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
#login p.h{color:var(--ink-2);font-size:14px;margin:0 0 22px}
#login label{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 5px}
#login .f{margin-bottom:14px}
button.primary{background:var(--ink);color:#fff;border:none;padding:12px 20px;border-radius:3px;font-weight:600;font-size:14.5px;width:100%}
button.primary:hover{background:var(--accent)}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:9px 16px;border-radius:3px;font-size:13.5px;width:auto}
button.ghost:hover{border-color:var(--ink)}
.err{color:var(--fail);font-size:13px;margin-top:10px;min-height:18px}

/* toolbar */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tools input,.tools select{width:auto;min-width:150px}

/* table */
table.list{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
table.list th{background:var(--ink);color:#fff;text-align:left;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;font-weight:500}
table.list td{border-top:1px solid var(--line-2);padding:11px 12px;vertical-align:middle}
table.list tr.row:hover td{background:#F8FAFB;cursor:pointer}
.pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;padding:3px 8px;border-radius:3px;white-space:nowrap}
.pill.g{background:var(--pass-w);color:var(--pass)}
.pill.r{background:var(--fail-w);color:var(--fail)}
.pill.a{background:var(--warn-w);color:var(--warn)}
.pill.n{background:var(--line-2);color:var(--ink-2)}
.score{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em}

/* spine: compact 6-bar signature */
.spine{display:flex;gap:2px;align-items:flex-end;height:22px}
.spine i{width:6px;background:var(--line);border-radius:1px;display:block}

/* card */
.cardbox{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin-bottom:14px}
.cardbox h3{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:700;margin:0 0 14px}
.hd{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-w);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0}
.verdict{padding:11px 14px;border-radius:3px;margin-top:16px;font-weight:600;font-size:14.5px}
.verdict.g{background:var(--pass-w);color:var(--pass)}
.verdict.r{background:var(--fail-w);color:var(--fail)}
.big{font-family:'Bricolage Grotesque',sans-serif;font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em}

.metric{padding:12px 0;border-top:1px solid var(--line-2)}
.metric:first-child{border-top:none;padding-top:0}
.metric .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.metric .nm{font-weight:500}
.metric .vl{font-family:'JetBrains Mono',monospace;font-weight:700}
.track{height:6px;background:var(--line-2);border-radius:3px;margin:7px 0;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px}
.metric .cm{font-size:13px;color:var(--ink-2)}

.mrow{display:flex;align-items:center;gap:12px;padding:6px 0}
.mrow .n{width:120px;flex-shrink:0;font-size:13.5px}
.mrow .t{flex:1;height:13px;background:var(--line-2);border-radius:2px;overflow:hidden}
.mrow .t i{display:block;height:100%}
.mrow .v{width:46px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line-2);flex-wrap:wrap}
.kv:first-child{border-top:none}
.kv .k{font-weight:500}
.kv .v{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-2)}
.kv .c{width:100%;font-size:13px;color:var(--ink-2);margin-top:3px}

.quote{background:var(--paper);border-radius:3px;padding:12px 14px;margin:8px 0 14px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:3px;padding:6px 10px;font-size:13px;background:var(--card);cursor:pointer}
.tags label.on{border-color:var(--accent);background:var(--accent-w);color:var(--accent)}
.tags input{width:auto}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.mrow .n{width:96px}}

.linkbox{background:var(--accent-w);border:1px solid var(--accent);border-radius:3px;padding:14px;margin-top:14px}
.linkbox .u{font-family:'JetBrains Mono',monospace;font-size:12px;word-break:break-all;background:var(--card);padding:9px;border-radius:3px;margin:8px 0}
.muted{color:var(--ink-2);font-size:13px}
.empty{text-align:center;padding:50px 20px;color:var(--ink-2)}
</style>
</head>
<body>

<!-- ============ ВХОД ============ -->
<div id="login">
  <div class="box">
    <h1>Кабинет</h1>
    <p class="h">Тест для медиабаеров</p>
    <div class="f"><label>Почта</label><input id="li-mail" type="email" autocomplete="username"></div>
    <div class="f"><label>Пароль</label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <button class="primary" id="li-btn">Войти</button>
    <div class="err" id="li-err"></div>
  </div>
</div>

<!-- ============ ПРИЛОЖЕНИЕ ============ -->
<div id="app" class="hide">
  <header class="bar">
    <span class="logo">Кабинет</span>
    <nav>
      <button data-v="list" class="on">Кандидаты</button>
      <button data-v="new">Добавить</button>
      <button data-v="stats">Источники</button>
    </nav>
    <span class="who"><span id="me"></span><button id="out">Выйти</button></span>
  </header>

  <div class="wrap">
    <!-- список -->
    <div id="v-list">
      <h1 class="page">Кандидаты</h1>
      <p class="sub" id="list-sub"></p>
      <div class="tools">
        <input id="f-q" placeholder="Поиск по имени">
        <select id="f-status"><option value="">Все статусы</option>
          <option value="invited">Приглашён</option><option value="opened">Открыл ссылку</option>
          <option value="in_progress">Проходит</option><option value="finished">Завершил</option>
          <option value="decided">Решение принято</option></select>
        <select id="f-tier"><option value="">Все результаты</option>
          <option value="priority">Приоритет</option><option value="pass">Проходит</option>
          <option value="fail">Не проходит</option><option value="stop">Стоп-фактор</option></select>
        <button class="ghost" id="f-reset">Сбросить</button>
      </div>
      <div id="list-body"></div>
    </div>

    <!-- карточка -->
    <div id="v-card" class="hide"></div>

    <!-- новый кандидат -->
    <div id="v-new" class="hide">
      <h1 class="page">Добавить кандидата</h1>
      <p class="sub">Ссылка создаётся сразу и работает один раз.</p>
      <div class="cardbox" style="max-width:520px">
        <div style="margin-bottom:12px"><div class="lbl">Имя и фамилия</div><input id="n-name"></div>
        <div style="margin-bottom:12px"><div class="lbl">Контакт: телеграм или почта</div><input id="n-contact"></div>
        <div style="margin-bottom:12px"><div class="lbl">Источник</div><select id="n-source"></select></div>
        <div style="margin-bottom:16px" id="n-detail-wrap" class="hide"><div class="lbl">От кого рекомендация</div><input id="n-detail"></div>
        <button class="primary" id="n-btn">Создать и получить ссылку</button>
        <div class="err" id="n-err"></div>
        <div class="linkbox hide" id="n-link">
          <div class="lbl" style="color:var(--accent)">Ссылка для кандидата</div>
          <div class="u" id="n-url"></div>
          <button class="ghost" id="n-copy">Скопировать</button>
        </div>
      </div>
    </div>

    <!-- статистика -->
    <div id="v-stats" class="hide">
      <h1 class="page">Источники</h1>
      <p class="sub">Какой канал приводит людей, которые проходят тест.</p>
      <div id="stats-body"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://ebyrccbbpzdfwdfgpysd.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVieXJjY2JicHpkZndkZmdweXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTM4NTcsImV4cCI6MjEwMjI4OTg1N30.kEQvX6kV-FwwRLG653AyyMnaUflLjsO2Bn-20vw72fQ';
const TEST_BASE=location.origin+'/test-buyer.html';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

let ME=null, SOURCES=[], ROWS=[];

/* ---------- словари ---------- */
const HOOK_TAGS=['событие оборвалось на середине','аномалия без объяснения','цифра, которая не сходится','инсайдер сказал лишнее','реакция организации','личная история с неожиданным исходом','столкновение двух сторон','попытка что-то скрыть','срок, после которого поздно','резкий контраст «было — стало»'];
const TYPE={d:'Денежник',s:'Статусник',z:'Результатник',b:'Бюджетник',r:'Романтик'};
const SUB={p:'процессник',i:'за идею',k:'за команду'};
const STATUS={invited:['Приглашён','n'],opened:['Открыл ссылку','n'],in_progress:['Проходит','a'],finished:['Завершил','g'],decided:['Решение принято','n']};
const METRICS=[
 ['cog','Счёт и логика','Считает уверенно, с юнит-экономикой проблем не будет','Со счётом тяжело: юнит-экономика будет даваться с трудом'],
 ['learn','Обучаемость','Обучается легко: новое схватывает с первого объяснения и перестраивается, когда правила меняются','Обучается тяжело: усваивает формулировки, но не перестраивается при смене правил'],
 ['gen','Поток идей','Идей выдаёт много и разных. Считается количество и непохожесть идей друг на друга — качество формулировок не оценивается','Идей мало или они однотипные. Считается количество и непохожесть идей, а не качество формулировок'],
 ['adapt','Работа с чужим опытом','Понимает, что связки не изобретают с нуля и не копируют один в один, а разбирают чужое и делают свои версии','Тянет либо в копирование один в один, либо в изобретательство с нуля'],
 ['sig','Осторожность с выводами','Не бросается принимать решения на десяти кликах, готов сказать «данных мало»','Готов принимать решения на недостаточных данных — прямой риск для бюджета'],
 ['optim','Устойчивость к неудачам','После серии сливов не опустит руки: воспринимает провалы как поправимые','Провалы воспринимает как постоянные и всеохватные — риск ухода после серии неудач']
];
const col=v=>v>=70?'#1F6B4E':v>=50?'#8A6100':'#A32B22';

/* ---------- вход ---------- */
$('li-btn').onclick=async()=>{
  $('li-err').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('li-mail').value.trim(),password:$('li-pass').value});
  if(error){$('li-err').textContent='Не удалось войти. Проверьте почту и пароль.';return;}
  init();
};
$('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('li-btn').click()});
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  ME=p||{full_name:session.user.email,role:'recruiter'};
  $('me').textContent=`${ME.full_name||''} · ${({recruiter:'рекрутер',hr_pp:'HR-PP',hrd:'HRD'})[ME.role]||ME.role}`;
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  const {data:s}=await sb.from('sources').select('*').eq('is_active',true).order('sort_order');
  SOURCES=s||[];
  $('n-source').innerHTML=SOURCES.map(x=>`<option value="${x.id}" data-d="${x.requires_detail}">${esc(x.name)}</option>`).join('');
  $('n-source').onchange=()=>{
    const o=$('n-source').selectedOptions[0];
    $('n-detail-wrap').classList.toggle('hide',o.dataset.d!=='true');
  };
  $('n-source').onchange();
  loadList();
}

/* ---------- навигация ---------- */
document.querySelectorAll('header.bar nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function show(v){
  document.querySelectorAll('header.bar nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ['list','card','new','stats'].forEach(x=>$('v-'+x).classList.toggle('hide',x!==v));
  if(v==='stats')loadStats();
  if(v==='list')loadList();
}

/* ---------- список ---------- */
['f-q','f-status','f-tier'].forEach(id=>$(id).oninput=renderList);
$('f-reset').onclick=()=>{$('f-q').value='';$('f-status').value='';$('f-tier').value='';renderList()};

async function loadList(){
  const {data,error}=await sb.from('candidate_list').select('*').order('created_at',{ascending:false});
  if(error){$('list-body').innerHTML=`<div class="empty">Не удалось загрузить список. ${esc(error.message)}</div>`;return;}
  ROWS=data||[];
  $('list-sub').textContent=`Всего ${ROWS.length}. Завершили тест ${ROWS.filter(r=>r.finished_at).length}.`;
  renderList();
}

function spine(sc){
  if(!sc)return '<span class="muted">—</span>';
  return '<span class="spine">'+METRICS.map(([k])=>{
    const v=Math.round((sc[k]??0)*100);
    return `<i style="height:${Math.max(3,v/100*22)}px;background:${col(v)}" title="${v}"></i>`;
  }).join('')+'</span>';
}

function renderList(){
  const q=$('f-q').value.toLowerCase().trim(), st=$('f-status').value, tr=$('f-tier').value;
  const rows=ROWS.filter(r=>
    (!q||(r.full_name||'').toLowerCase().includes(q))&&
    (!st||r.status===st)&&(!tr||r.tier===tr));
  if(!rows.length){$('list-body').innerHTML='<div class="empty">Никого не нашлось. Измените фильтры или добавьте кандидата.</div>';return;}
  $('list-body').innerHTML=`<table class="list"><thead><tr>
    <th>Кандидат</th><th>Источник</th><th>Рекрутер</th><th>Статус</th><th>Профиль</th><th>Балл</th><th>Сигналы</th></tr></thead><tbody>`+
   rows.map(r=>{
    const s=STATUS[r.status]||['—','n'];
    const v=r.tier==='priority'?['Приоритет','g']:r.tier==='pass'?['Проходит','g']:r.tier?['Не проходит','r']:null;
    return `<tr class="row" data-id="${r.id}">
      <td><b>${esc(r.full_name)}</b><div class="muted mono" style="font-size:11.5px">${new Date(r.created_at).toLocaleDateString('ru-RU')}</div></td>
      <td>${esc(r.source||'—')}${r.source_detail?`<div class="muted" style="font-size:12.5px">${esc(r.source_detail)}</div>`:''}</td>
      <td>${esc(r.recruiter||'—')}</td>
      <td><span class="pill ${s[1]}">${s[0]}</span></td>
      <td>${spine(r.scores)}</td>
      <td>${r.composite!=null?`<span class="score">${Math.max(3,Math.min(10,Math.round(r.composite/10)))}</span>${v?` <span class="pill ${v[1]}">${v[0]}</span>`:''}`:'<span class="muted">—</span>'}</td>
      <td>${r.cheat_signals>=2?'<span class="pill r">'+r.cheat_signals+' из 3</span>':r.cheat_signals==1?'<span class="pill a">1 из 3</span>':'<span class="muted">—</span>'}</td>
    </tr>`}).join('')+'</tbody></table>';
  document.querySelectorAll('tr.row').forEach(t=>t.onclick=()=>openCard(t.dataset.id));
}

/* ---------- карточка ---------- */
async function openCard(id){
  show('card');
  $('v-card').innerHTML='<div class="empty">Загружаем…</div>';
  const {data:c}=await sb.from('candidates').select('*, sources(name), profiles!candidates_recruiter_id_fkey(full_name)').eq('id',id).single();
  const {data:aa}=await sb.from('attempts').select('*').eq('candidate_id',id).order('invited_at',{ascending:false}).limit(1);
  const a=(aa||[])[0];
  const {data:ans}=a?await sb.from('answers').select('*').eq('attempt_id',a.id):{data:[]};
  renderCard(c,a,ans||[]);
}

function renderCard(c,a,ans){
  const back=`<button class="ghost" onclick="show('list')">← К списку</button>`;
  if(!a||!a.finished_at){
    const url=a?`${TEST_BASE}?t=${a.token}`:'';
    $('v-card').innerHTML=`${back}
    <div class="cardbox" style="margin-top:14px">
      <div class="hd"><div class="avatar">${esc((c.full_name||'?').split(' ').map(x=>x[0]).join('').slice(0,2))}</div>
      <div><div class="big" style="font-size:20px">${esc(c.full_name)}</div>
      <div class="muted">${esc(c.sources?.name||'—')}${c.source_detail?' · '+esc(c.source_detail):''} · ${esc(c.profiles?.full_name||'—')}</div></div></div>
      <div class="verdict" style="background:var(--line-2);color:var(--ink-2)">Тест ещё не завершён — ${esc((STATUS[c.status]||['—'])[0])}</div>
      ${url?`<div class="linkbox"><div class="lbl" style="color:var(--accent)">Ссылка кандидата</div><div class="u">${esc(url)}</div></div>`:''}
    </div>${notesBox(c)}`;
    bindNotes(c);
    return;
  }

  const sc=a.scores||{}, tel=a.telemetry||{}, b=sc.blocks||{}, asq=sc.asq||{};
  const gen=genScore(sc);
  const comp=composite(sc,gen);
  const score10=Math.max(3,Math.min(10,Math.round(comp/10)));
  const ok=a.tier==='priority'||a.tier==='pass';
  const motiv=Object.entries(sc.motiv||{}).sort((x,y)=>y[1]-x[1]);
  const eng=Object.entries(sc.engage||{}).sort((x,y)=>y[1]-x[1]);
  const dom=motiv[0]?.[0], sec=motiv[1]?.[0];
  const hooks=ans.filter(x=>x.block==='hooks');
  const causes=ans.filter(x=>x.block==='asq'&&x.item_key.startsWith('cause')&&x.value);
  const open=ans.filter(x=>x.block==='open');
  const vals={cog:sc.cog,learn:sc.learn,gen:gen,adapt:sc.adapt,sig:sc.sig,optim:sc.optim};

  $('v-card').innerHTML=`${back}

  <div class="cardbox" style="margin-top:14px">
    <div class="hd">
      <div class="avatar">${esc((c.full_name||'?').split(' ').map(x=>x[0]).join('').slice(0,2))}</div>
      <div style="flex:1;min-width:200px">
        <div class="big" style="font-size:20px">${esc(c.full_name)}</div>
        <div class="muted">${esc(c.sources?.name||'—')}${c.source_detail?' · '+esc(c.source_detail):''} · рекрутер ${esc(c.profiles?.full_name||'—')} · ${new Date(a.finished_at).toLocaleDateString('ru-RU')}</div>
      </div>
      <div style="text-align:right"><div class="big">${score10}</div><div class="muted mono" style="font-size:11.5px">из 10</div></div>
    </div>
    <div class="verdict ${ok?'g':'r'}">${ok?'Рекомендуется на практическую часть':'Не рекомендуется на практическую часть'}</div>
    <div style="margin-top:14px;font-weight:600">${esc(a.profile_type||'')}</div>
    <div class="muted" style="margin-top:4px">${esc(summary(vals,dom,sec,a))}</div>
  </div>

  <div class="cardbox">
    <h3>Что кандидат написал сам</h3>
    <div class="lbl">Хуки — ${hooks.length} шт${tel.block_times?.gen?` за ${tel.block_times.gen} мин`:''}</div>
    <div class="quote">${hooks.length?hooks.map(x=>esc(x.value)).join('\n'):'—'}</div>
    <div class="lbl">Причины своих провалов</div>
    <div class="quote">${causes.length?causes.map(x=>'«'+esc(x.value)+'»').join(' · '):'—'}</div>
    ${open.map((x,i)=>`<div class="lbl">${i===0?'Серия неудач':'Отношение к риску'}</div><div class="quote">${esc(x.value)||'—'}</div>`).join('')}
  </div>

  <div class="cardbox">
    <h3>Из чего сложился балл</h3>
    ${METRICS.map(([k,n,good,bad])=>{const v=Math.round((vals[k]??0)*100);
      return `<div class="metric"><div class="top"><span class="nm">${n}</span><span class="vl">${v}</span></div>
      <div class="track"><i style="width:${v}%;background:${col(v)}"></i></div>
      <div class="cm">${v>=55?good:bad}</div></div>`}).join('')}
    <div class="muted" style="margin-top:12px;font-size:12.5px">Шкала 0–100. Ниже 50 — слабая зона, выше 70 — сильная.</div>
  </div>

  <div class="cardbox">
    <h3>Разметка хуков</h3>
    <div class="muted" style="margin-bottom:6px">Отметьте механики любопытства, которые реально есть в списке. Несколько формулировок одной мысли — одна механика. Балл «поток идей» пересчитается сразу.</div>
    <div class="tags" id="tagbox">${HOOK_TAGS.map((t,i)=>
      `<label class="${(sc.gen_tags||[]).includes(i)?'on':''}"><input type="checkbox" data-i="${i}" ${(sc.gen_tags||[]).includes(i)?'checked':''}>${t}</label>`).join('')}</div>
  </div>

  <div class="grid2">
    <div class="cardbox">
      <h3>Мотивационный профиль</h3>
      ${motiv.map(([k,v],i)=>`<div class="mrow"><span class="n" style="${i<2?'font-weight:600':'color:var(--ink-2)'}">${TYPE[k]||k}</span>
        <span class="t"><i style="width:${Math.round((v-12)/48*100)}%;background:${i===0?'#2B3A8C':i===1?'#8DA8D8':'#B9BEC6'}"></i></span>
        <span class="v">${v}/60</span></div>`).join('')}
      <div style="margin-top:12px;font-size:13.5px;line-height:1.6">
        <div><b>Ведущий: ${TYPE[dom]}.</b> ${DESC[dom]||''}</div>
        <div style="margin-top:6px"><b>Второй: ${TYPE[sec]}.</b> ${DESC[sec]||''}</div>
        ${(dom==='r'||sec==='r')&&eng[0]?`<div style="margin-top:6px"><b>Что затягивает:</b> ${SUB[eng[0][0]]}, ${eng[0][1]} из 18.</div>`:''}
      </div>
    </div>

    <div class="cardbox">
      <h3>Как объясняет свои неудачи</h3>
      <div class="muted" style="margin-bottom:8px">Шесть провальных ситуаций, кандидат называл причину.</div>
      ${[['Винит себя или обстоятельства?',asq.internal,v=>v>=2.5&&v<=4.4,'Берёт ответственность, значит будет учиться на ошибках','Списывает на обстоятельства — учиться на сливах не будет'],
         ['Причина разовая или навсегда?',asq.stable,v=>v<3.8,'Считает, что это поправимо','Считает провалы постоянными — риск опустить руки'],
         ['Причина про этот случай или про всё?',asq.global,v=>v<3.8,'Не обобщает провал на всю профпригодность','Обобщает провал на всё, что делает']]
        .map(([q,v,good,y,n])=>`<div class="kv"><span class="k">${q}</span><span class="v">${(v??0).toFixed(1)} из 5</span>
        <span class="c" style="color:${good(v??0)?'var(--pass)':'var(--fail)'}">${good(v??0)?y:n}</span></div>`).join('')}
    </div>
  </div>

  <div class="cardbox">
    <h3>Детализация по блокам</h3>
    ${[['Счёт',`${b.num??'—'} из 12`,tel.block_times?.num],
       ['Логика',`${b.log??'—'} из 10`,tel.block_times?.log],
       ['Новые правила',`${b.tr??'—'} из 8`,tel.block_times?.tr],
       ['Смена правил',`${b.am??'—'} из 4`,tel.block_times?.am],
       ['Осторожность',`${b.sig??'—'} из 6`,tel.block_times?.sig],
       ['Чужой опыт',`${b.adapt??'—'} из 5`,tel.block_times?.ad]]
      .map(([n,r,t])=>`<div class="kv"><span class="k">${n}</span><span class="v">${r}${t?' · '+t+' мин':''}</span></div>`).join('')}
    <div class="kv"><span class="k">Честность</span><span class="v">${(sc.tools?.fake||0)===0?'пройдено':(sc.tools.fake)+' несуществующих'}</span>
      <span class="c">${(sc.tools?.fake||0)===0?'В списке инструментов были несуществующие названия. Ни одно не отметил как знакомое.':'Отметил как знакомые инструменты, которых не существует.'}</span></div>
    <div class="kv"><span class="k">Время</span><span class="v">${Math.round((a.used_sec||0)/60)} мин из 85</span>
      <span class="c">${a.over_sec>0?'Превышение на '+Math.round(a.over_sec/60)+' мин':'Уложился в норматив'}</span></div>
  </div>

  <div class="cardbox">
    <h3>Признаки подсказок со стороны</h3>
    <div class="kv"><span class="k">Уходил с вкладки</span><span class="v">${tel.away??0} раз${tel.away_ms?', '+Math.round(tel.away_ms/1000)+' сек':''}</span></div>
    <div class="kv"><span class="k">Пытался вставить скопированный текст</span><span class="v">${tel.pastes??0}</span></div>
    <div class="kv"><span class="k">Текст появлялся целым куском</span><span class="v">${tel.bursts??0}</span></div>
    <div class="verdict ${(tel.signals||0)>=2?'r':(tel.signals||0)==1?'':'g'}" style="${(tel.signals||0)==1?'background:var(--warn-w);color:var(--warn)':''}">
      ${(tel.signals||0)>=2?'Сигналов '+tel.signals+' из 3 — стоит проверить блок хуков живьём в созвоне'
        :(tel.signals||0)==1?'Один сигнал — сам по себе не решающий'
        :'Похоже, проходил сам'}</div>
  </div>

  ${notesBox(c)}`;

  bindNotes(c);
  document.querySelectorAll('#tagbox input').forEach(cb=>cb.onchange=async()=>{
    const tags=[...document.querySelectorAll('#tagbox input:checked')].map(x=>+x.dataset.i);
    document.querySelectorAll('#tagbox label').forEach((l,i)=>l.classList.toggle('on',tags.includes(i)));
    const ns={...sc,gen_tags:tags};
    const g=genScore(ns), nc=composite(ns,g);
    await sb.from('attempts').update({scores:ns,composite:nc}).eq('id',a.id);
    openCard(c.id);
  });
}

const DESC={
 z:'Работает на измеримую цель, любит сложные задачи, легко говорит о неудачах и разбирает их.',
 d:'Меряет всё деньгами. Работает на прогрессивный процент, в детали не лезет.',
 r:'Открыт новому, быстро загорается, много пробует. Может так же быстро остыть, если станет неинтересно.',
 b:'Ценит предсказуемость и порядок, тяжело переносит форс-мажоры и неопределённость.',
 s:'Нужен рост в статусе и признание. Без этого мотивация быстро проседает.'
};

function genScore(sc){
  const cnt=Math.min(sc.gen_count||0,12)/12;
  const tags=(sc.gen_tags||[]).length/10;
  return cnt*.4+tags*.6;
}
function composite(sc,gen){
  return Math.round(100*((sc.cog||0)*.18+(sc.learn||0)*.18+gen*.18+(sc.adapt||0)*.14+
    (sc.sig||0)*.12+(sc.optim||0)*.10+((sc.z_rank===0)?1:(sc.z_rank===1)?.75:.2)*.10));
}
function summary(v,dom,sec,a){
  const parts=[];
  if(dom==='z'&&sec==='r')parts.push('Генеративный тип: много гипотез, высокая скорость итерации. Топливо — сам процесс поиска.');
  else if(dom==='z'&&sec==='d')parts.push('Холодный масштабировщик: работает на цифру и на процент.');
  else if(dom==='z')parts.push('Работает на измеримую цель, нужен постоянный вызов.');
  else parts.push('Профиль нетипичный для позиции, стоит проверить на практике особенно тщательно.');
  const weak=METRICS.filter(([k])=>(v[k]??0)<0.55).map(([,n])=>n.toLowerCase());
  if(weak.length)parts.push('Слабые места: '+weak.join(', ')+'.');
  if((a.telemetry?.signals||0)>=2)parts.push('Есть признаки посторонней помощи.');
  return parts.join(' ');
}

function notesBox(c){
  return `<div class="cardbox"><h3>Решение и заметки</h3>
  <div class="tools" style="margin-bottom:10px">
    <select id="d-dec" style="min-width:200px">
      <option value="">Решение не принято</option>
      <option value="practice">Пригласили на практику</option>
      <option value="reserve">В резерв</option>
      <option value="rejected">Отказ</option></select>
    <button class="ghost" id="d-save">Сохранить</button>
    <span class="muted" id="d-ok"></span>
  </div>
  <textarea id="d-notes" rows="4" placeholder="Что выяснилось на созвоне, впечатление, договорённости…">${esc(c.notes||'')}</textarea></div>`;
}
function bindNotes(c){
  if($('d-dec'))$('d-dec').value=c.decision||'';
  if(!$('d-save'))return;
  $('d-save').onclick=async()=>{
    const dec=$('d-dec').value||null;
    const patch={notes:$('d-notes').value,decision:dec};
    if(dec){patch.status='decided';patch.decided_at=new Date().toISOString();patch.decided_by=ME.id;}
    const {error}=await sb.from('candidates').update(patch).eq('id',c.id);
    $('d-ok').textContent=error?'Не сохранилось':'Сохранено';
    setTimeout(()=>{if($('d-ok'))$('d-ok').textContent=''},2500);
  };
}

/* ---------- новый кандидат ---------- */
$('n-btn').onclick=async()=>{
  $('n-err').textContent='';
  const name=$('n-name').value.trim();
  if(!name){$('n-err').textContent='Впишите имя кандидата.';return;}
  const opt=$('n-source').selectedOptions[0];
  if(opt?.dataset.d==='true'&&!$('n-detail').value.trim()){$('n-err').textContent='Укажите, от кого рекомендация.';return;}
  const {data:c,error:e1}=await sb.from('candidates').insert({
    full_name:name, contact:$('n-contact').value.trim()||null,
    source_id:$('n-source').value, source_detail:$('n-detail').value.trim()||null,
    recruiter_id:ME.id
  }).select().single();
  if(e1){$('n-err').textContent='Не удалось создать: '+e1.message;return;}
  const {data:a,error:e2}=await sb.from('attempts').insert({candidate_id:c.id}).select().single();
  if(e2){$('n-err').textContent='Кандидат создан, но ссылка не выпустилась: '+e2.message;return;}
  const url=`${TEST_BASE}?t=${a.token}`;
  $('n-url').textContent=url; $('n-link').classList.remove('hide');
  $('n-copy').onclick=()=>{navigator.clipboard.writeText(url);$('n-copy').textContent='Скопировано';setTimeout(()=>$('n-copy').textContent='Скопировать',2000)};
  $('n-name').value='';$('n-contact').value='';$('n-detail').value='';
};

/* ---------- статистика ---------- */
async function loadStats(){
  const {data,error}=await sb.from('source_stats').select('*');
  if(error||!data?.length){$('stats-body').innerHTML='<div class="empty">Пока нет данных.</div>';return;}
  $('stats-body').innerHTML=`<table class="list"><thead><tr>
    <th>Источник</th><th>Всего</th><th>Завершили</th><th>Рекомендованы</th><th>Средний балл</th></tr></thead><tbody>`+
    data.map(r=>`<tr><td><b>${esc(r.source||'—')}</b></td><td class="mono">${r.total}</td>
      <td class="mono">${r.finished}</td><td class="mono">${r.recommended||0}</td>
      <td class="mono">${r.avg_score??'—'}</td></tr>`).join('')+'</tbody></table>';
}

sb.auth.getSession().then(({data:{session}})=>{if(session)init()});
</script>
